name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK components
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_SDK_ROOT" || ls "$ANDROID_HOME" || true
          SDKMGR=$(command -v sdkmanager || echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager")
          yes | "$SDKMGR" --licenses || true
          "$SDKMGR" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0" "platform-tools" || true
      - run: npm install
      # SDK 54 / RN 0.81 defaults to Kotlin 2.1.20; do NOT force Kotlin 1.9.25
      # (that was only for the old SDK 52 / Compose 1.5.15 mismatch).
      - run: CI=1 npx expo prebuild --platform android
      # Debug APK deliberately skips JS bundling (it expects a Metro server),
      # so it shows "Unable to load script" on a phone. Build release instead:
      # release embeds index.android.bundle and signs with the debug keystore
      # configured by expo prebuild, so it runs standalone.
      - name: Build release APK
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1-release-${{ github.run_number }}
          name: 合集版 v0.1 release ${{ github.run_number }}
          files: android/app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
